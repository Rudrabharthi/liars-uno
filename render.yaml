services:
  - type: web
    name: liars-uno
    runtime: node
    rootDir: liars-uno
    plan: free
    buildCommand: npm --prefix server install && npm --prefix client install && npm --prefix client run build
    startCommand: node server/src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
